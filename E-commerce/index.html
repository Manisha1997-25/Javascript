<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-commerce</title>
  <link rel="stylesheet" href="./style.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">E-commerce</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo02"
        aria-controls="navbarTogglerDemo02" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="./addProduct.html">Add Product<a>
          </li>

        </ul>
        <div class="d-flex">
          <a class="nav-link" href="./cart.html">
            <i class="fa-solid fa-cart-shopping"></i>
            <sup id="cartLength">0</sup>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Electronics Hero Section -->
  <section class="hero-section">
    <div class="container">
      <div class="row align-items-center">

        <!-- Left Content -->
        <div class="col-lg-6">

          <span class="badge bg-danger mb-3">
            SPECIAL OFFER
          </span>

          <h1 class="display-3 fw-bold">
            Upgrade Your
            <span class="text-primary">Technology</span>
          </h1>

          <p class="lead text-secondary">
            Discover the latest smartphones, laptops,
            headphones, smartwatches and other electronics
            at amazing prices.
          </p>

          <h3 class="text-danger fw-bold">
            Up to 50% OFF
          </h3>

          <div class="mt-4">

            <button class="btn btn-primary btn-lg me-2" onclick="shopNow()">
              Shop Now
            </button>

            <button class="btn btn-outline-dark btn-lg" onclick="exploreProducts()">
              Explore Products
            </button>

          </div>

        </div>


        <!-- Right Image -->
        <div class="col-lg-6 text-center mt-5 mt-lg-0">

          <div class="hero-image-container">

            <img src="https://images.unsplash.com/photo-1468495244123-6c6c332eeece" class="img-fluid hero-image"
              alt="Electronics">

            <div class="offer-badge">
              50%<br>
              OFF
            </div>

          </div>

        </div>

      </div>
    </div>
  </section>

  <div class="container">
      <div class="row" id="renderProducts"></div>
  </div>



 <script src="./script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
