<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Royal Infield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        .product-card {
            transition: all 0.4s ease;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .product-card img {
            transition: transform 0.5s ease;
        }

        .product-card:hover img {
            transform: scale(1.05);
        }

        .ball {
            width: 15px;
            height: 15px;

            border-radius: 50%;
        }

        .ball:hover {
            cursor: pointer;
        }

        .redBall {
            background-color: red;
        }

        .blueBall {
            background-color: blue;
        }

        .yellowBall {
            background-color: rgb(220, 220, 87);
        }
    </style>
</head>

<body>
    <div class="container mt-5">

        <div id="card1">
            <div class="card product-card" style="width: 18rem;">
                <img src="./blue.jpg" class="card-img-top" alt="..." id="imgCard">
                <div class="card-body">
                    <span class="badge rounded-pill bg-primary" id="badgeColor">Blue</span>
                    <h5 class="card-title">Royal Enfield 360</h5>
                    <p class="card-text">A powerful and stylish motorcycle designed for an excellent riding experience
                    </p>

                    <div class="car-info">
                        <p class="mb-1">
                            <i class="bi bi-car-front-fill text-dark"></i>
                            Mileage: 4,000 miles
                        </p>

                        <p class="mb-1">
                            <i class="bi bi-fuel-pump-fill text-dark"></i>
                            Fuel: 25mpg
                        </p>

                        <p class="mb-3">
                            <i class="bi bi-shield-fill text-dark"></i>
                            Safety:
                            <span class="stars">
                                ★ ★ ★ ★ ★
                            </span>
                        </p>
                        
                        Pick a color:
                        </p>
                        <div style="display: flex; gap:5px; ">

                            <div class="blueBall ball" id="blueBTN"></div>
                            <div class="redBall ball" id="redBTN"></div>
                            <div class="yellowBall ball" id="yellowBTN"></div>
                        </div>
                        <a href="#" class="btn btn-primary mt-2" id="btnView">View Details</a>
                    </div>
                </div>
            </div>



        </div>


        <script src="scriptBike.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</body>

</html>
