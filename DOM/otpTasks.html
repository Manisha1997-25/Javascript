<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .main_Container {
            background-color: aqua;
            margin-top: 25px;
        }

        .container {
            padding: 20px 20px;


        }

        .otpBox {
            width: 30px;
            height: 30px;
            border-radius: 8px;
        }

        .btnCheck {
            width: 20px;
            height: 20px;
        }
    </style>
</head>

<body>
    <div class="main_Container">
        <div class="container">
            <button class="btn btn-warning" id="generateOtp" onclick="generateOtp()">Generate OTP</button>
            <div class="" id="otpDisplay"></div>

            <h3>Verification Code</h3>
            <p></p>
            <div>
                <input type="text" maxlength="1" class="otpBox" id="otpBox1">
                <input type="text" maxlength="1" class="otpBox" id="otpBox2">
                <input type="text" maxlength="1" class="otpBox" id="otpBox3">
                <input type="text" maxlength="1" class="otpBox" id="otpBox4">
                <p id="errorMsg"></p>
                <p id="successfulMsg"></p>
            </div>
            <button class="btn btn-success mt-4" id="verifyBtn">Verify</button>
        </div>
    </div>
    <script>
        //Get Elements

        const otpDisplayElmt = document.querySelector("#otpDisplay")
        const otpBox1Elmt = document.querySelector("#otpBox1")
        const otpBox2Elmt = document.querySelector("#otpBox2")
        const otpBox3Elmt = document.querySelector("#otpBox3")
        const otpBox4Elmt = document.querySelector("#otpBox4")
        const errorMsgElmt = document.querySelector("#errorMsg")
        const successfulMsgElmt = document.querySelector("#successfulMsg")
        const verifyBtnElmt = document.querySelector("#verifyBtn")

        let otp

        function generateOtp() {
            otp = Math.floor(1000 + Math.random() * 9000)
            otpDisplayElmt.textContent = otp
        }

        otpBox1Elmt.addEventListener("input", () => {
            if (otpBox1Elmt.value !== "") {
                otpBox2Elmt.focus()
            }
        })

        otpBox2Elmt.addEventListener("input", () => {
            if (otpBox2Elmt.value !== "") {
                otpBox3Elmt.focus()
            }
        })
        otpBox3Elmt.addEventListener("input", () => {
            if (otpBox3Elmt.value !== "") {
                otpBox4Elmt.focus()
            }
        })

        //Verify Otp

        verifyBtnElmt.addEventListener("click", () => {
            const digit1 = otpBox1Elmt.value
            const digit2 = otpBox2Elmt.value
            const digit3 = otpBox3Elmt.value
            const digit4 = otpBox4Elmt.value

            const otpFrmUser = digit1 + digit2 + digit3 + digit4

            if (otpFrmUser === otp.toString()) {
                alert("OTP Verified Successfully")

            } else {
                alert("Invalid OTP. Please Try Again")

            }
        })
    </script>
    <hr>
    <section>

        <label for="passwordLength">Password Length : </label>
        <input type="number" id="passwordLength" value="17" min="4" max="50">
        <div class="form-check">
            <input type="checkbox" class="btnCheck" id="includeNumbers">
            <label class="btn" for="includeNumbers">Include Numbers</label>
        </div>
        <div class="form-check">

            <input type="checkbox" class="btnCheck" id="includeUppercase">
            <label class="btn" for="includeUppercase">Include Uppercase</label>
        </div>
        <div class="form-check">
            <input type="checkbox" class="btnCheck" id="includeSpecial">
            <label class="btn" for="includeSpecial">Include Special Characters </label>
        </div>
        <div class="form-check">
            <input type="checkbox" class="btnCheck" id="excludeAmbiguou">
            <label class="btn" for="excludeAmbiguou">Exclude ambiguous characters(e.g. l, 1, I, o, 0) </label>
        </div>
        <button class="btn btn-primary" id="generateBtn" onclick="generatePassword()">Generate Password</button>
        <div class="genrateTitle">Generated Password : </div>
        <div id="passwordDisplay"></div>
        <div>
            <input type="checkbox" id="showPassword" checked onchange="showHidePassword()">
            <!--  -->
            <label for="showPassword">Show Password</label>
        </div>
        <div class="strengthContainer">
            <div id="strengthBar">
                <div id="strengthProgress"></div>
            </div>
            <div id="strengthText"></div>
        </div>

        <button class="btn btn-light border" id="copyBtn" onclick="copyPassword()">Copy</button>

    </section>
    <script>
        //store generated Password
        let generatedPassword = ""
        function generatePassword() {
            //get values from HTML
            const length = document.querySelector("#passwordLength").value
            const numbers = document.querySelector("#includeNumbers").checked
            const uppercase = document.querySelector("#includeUppercase").checked
            const special = document.querySelector("#includeSpecial").checked
            const ambiguous = document.querySelector("#excludeAmbiguou").checked

            //Characters set
            let lowercase = "abcdefghijklmnopqrstuvwxyz"
            let upperCase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
            let nmbr = "0123456789"
            let specialChar = "!@#$%^&*()_+{}[]<>?"

            //Remove Ambigous characters(looks like to similar)
            if (ambiguous) {
                lowercase = lowercase.replace(/[ilo]/g, "")
                upperCase = upperCase.replace(/[ILO]/g, "")
                nmbr = nmbr.replace(/[10]/g, "")
            }

            // Start with lowercase characters
            let characters = lowercase

            // Add selected character sets
            if (uppercase) {
                characters += upperCase
            }

            if (numbers) {
                characters += nmbr
            }

            if (special) {
                characters += specialChar
            }

            //validation

            if (length < 4 || length > 50) {
                alert("Password length should be between 4 and 50")
                return
            }

            if (characters.length === 0) {
                alert("Please select at least one character type")
                return
            }

            //generate Password

            generatedPassword = ""
            for (let i = 0; i < length; i++) {
                const randomindex = Math.floor(Math.random() * characters.length)
                generatedPassword += characters[randomindex]
            }

            // Display Password
            showHidePassword()

            // Calculate strength
            calculateStrength(generatedPassword);

        }
        // Show / Hide password

        function showHidePassword() {

            const showPassword =
                document.querySelector("#showPassword").checked;

            const passwordDisplay =
                document.querySelector("#passwordDisplay");


            if (generatedPassword === "") {

                passwordDisplay.textContent =
                    "Your password will appear here";

                return;
            }


            if (showPassword) {

                passwordDisplay.textContent =
                    generatedPassword;

            } else {

                passwordDisplay.textContent =
                    "*".repeat(generatedPassword.length);

            }

        }



        // Password strength

        function calculateStrength(password) {

            let score = 0;


            // Length

            if (password.length >= 8) {
                score++;
            }

            if (password.length >= 12) {
                score++;
            }

            if (password.length >= 16) {
                score++;
            }


            // Lowercase

            if (/[a-z]/.test(password)) {
                score++;
            }


            // Uppercase

            if (/[A-Z]/.test(password)) {
                score++;
            }


            // Number

            if (/[0-9]/.test(password)) {
                score++;
            }


            // Special character

            if (/[^A-Za-z0-9]/.test(password)) {
                score++;
            }


            const strengthProgress =
                document.querySelector("#strengthProgress");

            const strengthText =
                document.querySelector("#strengthText");


            if (score <= 2) {

                strengthProgress.style.width = "25%";
                strengthProgress.style.backgroundColor = "red";

                strengthText.textContent = "Weak";

            } else if (score <= 4) {

                strengthProgress.style.width = "50%";
                strengthProgress.style.backgroundColor = "orange";

                strengthText.textContent = "Medium";

            } else if (score <= 6) {

                strengthProgress.style.width = "75%";
                strengthProgress.style.backgroundColor = "yellow";

                strengthText.textContent = "Strong";

            } else {

                strengthProgress.style.width = "100%";
                strengthProgress.style.backgroundColor = "green";

                strengthText.textContent = "Very Strong";

            }

        }



        // Copy password

        function copyPassword() {

            if (generatedPassword === "") {

                alert("Please generate a password first.");

                return;
            }


            navigator.clipboard.writeText(generatedPassword)
                .then(function () {

                    alert("Password copied!");

                })
                .catch(function () {

                    alert("Unable to copy password.");

                });
        }
        
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
</body>

</html>
