<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container p-3">
        <h1 class="display-4 text-center">To Do List Manager</h1>
        <div class="container w-50">
            <div class="input-group mb-3">
                <input type="text" class="form-control me-2" placeholder="Enter a Task" id="inputTask">
                <button class="btn btn-primary me-2" onclick="addNewTask()">Add Task</button>
                <button class="btn btn-primary" onclick="clearAll()">Clear All</button>
            </div>
            <ul id="lists"> </ul>
        </div>
    </div>

    <hr>

    <div class="container p-3">
        <h1 class="display-4 text-center">Students Marks Calculator</h1>
        <div class="container w-50">
            <div class="input-group mb-3">
                <input type="text" class="form-control me-2" placeholder="Enter a Marks" id="inputMarks">
                <button class="btn btn-primary me-2" onclick="addMarks()">Add Mark</button>
                <button class="btn btn-primary me-2" onclick="calculate()">Calculate</button>
                <button class="btn btn-primary" onclick="reset()">Reset</button>
                
                
            </div>
            <div>
                <h4 id="total"></h4>
                <h4 id="average"></h4>
                <h4 id="highest"></h4>
                <h4 id="lowest"></h4>
                
            </div>
    </div>

    <hr>

    <div class="container p-3">
        <h1 class="display-4 text-center">Search in an Array</h1>
        <div class="container w-50">
            <div class="input-group mb-3">
                <input type="text" class="form-control me-2" placeholder="Enter for search" id="inputSearch">
                <button class="btn btn-primary me-2" onclick="addSearch()">Search</button><br>
                <p id="result"></p>
            </div>
        </div>
    </div>
    <hr>

    <div class="container p-3">
        <h1 class="display-4 text-center">Filter Even and Odd Numbers</h1>
        <div class="container w-50">
            <div class="input-group mb-3">
                <input type="text" class="form-control me-2" placeholder="Enter a Number" id="inputNumber">
                <button class="btn btn-primary me-2" onclick="addNumbers()">Add Number</button>
                <button class="btn btn-primary me-2" onclick="showEven()">Show Even</button>
                <button class="btn btn-primary me-2" onclick="showOdd()">Show Odd</button>
                <button class="btn btn-primary" onclick="clearNumbers()">Clear</button>
            </div>
            <h3>Even Numbers</h3>
            <div id="evenNUmbers"></div>
            <h3>Odd Numbers</h3>
            <div id="oddNumbers"></div>
        </div>
    </div>
    <hr>

    <div class="container p-3">
        <h1 class="display-4 text-center">Sort Name Alphabatically</h1>
        <div class="container w-50">
            <div class="input-group mb-3">
                <input type="text" class="form-control me-2" placeholder="Enter a Name" id="inputName">
                <button class="btn btn-primary me-2" onclick="addName()">Add Name</button>
                <button class="btn btn-primary me-2" onclick="sortArray()">Sort</button>
                <button class="btn btn-primary" onclick="clearNames()">Clear All</button>

            </div>
            <h3>unsorted Name</h3>
            <div id="unsortedName"></div>
            <h3>unsorted Name</h3>
            <div id="sortedName"></div>
        </div>
    </div>

    <script src="arrayAssignproj.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
